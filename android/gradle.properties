# JVM args: AGP 8.12 + Kotlin 2.1 recommend 3G heap
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8

# Use AndroidX
android.useAndroidX=true

# Only generate R class for this module (faster builds)
android.nonTransitiveRClass=true

# Official Kotlin code style
kotlin.code.style=official

# Optional: build cache / parallel (keep commented for the first build)
# org.gradle.parallel=true
# org.gradle.caching=true
